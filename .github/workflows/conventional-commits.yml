name: Conventional Commits

# Enforces Conventional Commits (https://www.conventionalcommits.org/) on every PR:
# every commit message in the PR must conform, and the PR title must too (since that
# becomes the squash-merge commit message by default on GitHub).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request-target:
    name: Enforce beta promotion path
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request target
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE_BRANCH" = "beta" ]; then
            exit 0
          fi

          if [ "$BASE_BRANCH" = "main" ] && [ "$HEAD_BRANCH" = "beta" ]; then
            exit 0
          fi

          echo "Pull requests must target beta. Only the beta branch may be merged into main."
          exit 1

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  security-events: write

jobs:
  build-test-sbom:
    uses: ./.github/workflows/build-test-sbom.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: build-test-sbom
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic_release.outputs.new_release_published }}
      tag: ${{ steps.semantic_release.outputs.new_release_git_tag }}
      version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release from Conventional Commits
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show release outputs
        run: |
          echo "Published: ${{ steps.semantic_release.outputs.new_release_published }}"
          echo "Tag: ${{ steps.semantic_release.outputs.new_release_git_tag }}"
          echo "Version: ${{ steps.semantic_release.outputs.new_release_version }}"

  publish:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained win-x64 build
        run: >
          dotnet publish src/BootUSBit.Wpf/BootUSBit.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ needs.release.outputs.version }}
          --output publish

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: publish

      - name: Zip release package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath BootUSBit-${{ needs.release.outputs.version }}-win-x64.zip

      - name: Attach Windows package to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: BootUSBit-${{ needs.release.outputs.version }}-win-x64.zip

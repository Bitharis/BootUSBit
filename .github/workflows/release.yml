name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  security-events: write

jobs:
  build-test-sbom:
    uses: ./.github/workflows/build-test-sbom.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: build-test-sbom
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic_release.outputs.new_release_published }}
      tag: ${{ steps.semantic_release.outputs.new_release_git_tag }}
      version: ${{ steps.semantic_release.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release from Conventional Commits
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained win-x64 build
        run: >
          dotnet publish src/BootUSBit.Wpf/BootUSBit.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Version=${{ needs.release.outputs.version }}
          --output publish

      - name: Sign executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Warning "No Windows signing certificate configured; the release will show as an unknown publisher."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "bootusbit-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $executable = Join-Path $PWD "publish\BootUSBit.Wpf.exe"
          & signtool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $executable
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE." }

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: publish

      - name: Zip release package
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath BootUSBit-${{ needs.release.outputs.version }}-win-x64.zip

      - name: Attach Windows package to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: BootUSBit-${{ needs.release.outputs.version }}-win-x64.zip
